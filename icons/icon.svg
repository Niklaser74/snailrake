  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#6cc25a"/>
    <g fill="rgba(0,0,0,0.06)">
      <rect x="0" y="64" width="512" height="64"/><rect x="0" y="192" width="512" height="64"/>
      <rect x="0" y="320" width="512" height="64"/><rect x="0" y="448" width="512" height="64"/>
